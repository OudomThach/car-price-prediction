name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy car_price_prediction

      - name: Test
        run: uv run pytest --cov=car_price_prediction --cov-report=term-missing --cov-report=html --cov-fail-under=70

      - name: Build
        run: uv build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: htmlcov/
